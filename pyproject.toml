[project]
name = "ingen-safety-lens"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1",
  "numpy==2.2.6",
  "scikit-learn==1.6.1",
  "psutil==7.0.0",
  "mlflow==2.22.0",
  "sqlalchemy==2.0.41",
  "pydantic==2.11.5",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "black==25.1.0", "pre-commit==4.2.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
